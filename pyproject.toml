[project]
name = "coursework-2-oop"
version = "0.1.0"
description = ""
authors = [
    {name = "AntonDav23",email = "antonses@icloud.com"}
]
requires-python = ">=3.14"
dependencies = [
    "requests (>=2.34.2,<3.0.0)",
    "python-dotenv (>=1.2.4,<2.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.2.0,<10.0.0)",
    "pytest-cov (>=7.1.0,<8.0.0)",
    "black (>=26.10.1,<27.0.0)",
    "flake8 (>=7.5.0,<8.0.0)",
    "mypy (>=2.4.1,<3.0.0)",
    "isort (>=9.0.2,<10.0.0)"
]


[tool.mypy]
disallow_untyped_defs = true
no_implicit_optional = true
warn_return_any = true
exclude = 'venv'


[tool.black]
line-length = 119
exclude = '\.git'


[tool.isort]
line_length = 119
profile = "black"


[tool.pytest.ini_options]
pythonpath = ["src"]
